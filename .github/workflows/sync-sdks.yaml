name: Sync SDKs with generator

# Regenerates the SDKs when generator templates/configs change on main and
# opens a PR in the SDK repo if the output differs.
#
# SDK factory additions (all optional, so the default behaviour is unchanged):
# - openapi_ref, generator_repo and generator_ref pick what to generate from.
# - change_id names a factory change. It gives the run its own sync branch and
#   a draft PR labelled `factory`.
# - port_after starts the factory port worker on each sync PR, so an agent
#   adds the hand-written layer in a stacked draft PR. It skips an SDK whose
#   fork already has an open port PR for the change. model picks the worker's
#   Copilot model. The router sets it from `models` in factory/sdks.yaml.
# - A run with change_id and an openapi_ref, generator_repo or generator_ref
#   builds each SDK before and after that change and applies only the
#   difference (factory/scripts/delta_sync.sh). Release versions and hand
#   edits on the SDK's main stay. Other runs regenerate the whole SDK.
# - Repository names come from factory/sdks.yaml when it exists, then from
#   vars.SDK_REPO_OVERRIDES, for example {"go":"openfga-go-sdk"}.
# - vars.FACTORY_SKIP_PUSH_SYNC=true skips the push trigger. Set it in a fork
#   that merges upstream main, or every merge opens sync PRs.
# - Without the releaser App or GPG secrets, the push falls back to
#   secrets.FACTORY_TOKEN and unsigned commits.
# - The sync job runs generator and SDK code, so it gets no token or secret.
#   It saves each SDK's change as a patch. The publish job checks the patch,
#   then commits and pushes it and opens the PR, without running that code.

on:
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "scripts/**"
      - "docker/**"
      - "Makefile"
  workflow_dispatch:
    inputs:
      sdk:
        description: "SDK to sync"
        type: choice
        default: all
        options:
          - all
          - js
          - go
          - dotnet
          - python
          - java
      openapi_ref:
        description: "OpenFGA API commit or tag to generate against (empty uses the Makefile pin)"
        type: string
        default: ""
      generator_repo:
        description: "Repository to take the generator from (empty uses this repository)"
        type: string
        default: ""
      generator_ref:
        description: "Generator branch, tag, SHA or refs/pull/N/head (empty uses the workflow ref)"
        type: string
        default: ""
      change_id:
        description: "SDK factory change id (uses branch sync/factory-<id> and a draft PR)"
        type: string
        default: ""
      port_after:
        description: "Start the factory port worker on each new sync PR (needs change_id)"
        type: boolean
        default: false
      tracking_issue:
        description: "SDK factory tracking issue number in this repository"
        type: string
        default: ""
      model:
        description: "Copilot model for the port worker (empty uses the worker's default)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: sync-sdks-${{ github.ref }}-${{ inputs.change_id || 'default' }}-${{ inputs.sdk || 'all' }}
  cancel-in-progress: true

env:
  SYNC_BRANCH: sync/sdk-generator
  PR_TITLE: "chore(sync): sync with generator"
  PR_LABEL: "sync-with-generator"

jobs:
  # On manual dispatch, narrow the matrix to the selected SDK.
  prepare:
    if: github.event_name != 'push' || vars.FACTORY_SKIP_PUSH_SYNC != 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout SDK registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: factory/sdks.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The change id becomes branch names and a pattern in the publish job.
      - name: Check the change id
        env:
          CHANGE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.change_id || '' }}
        run: |
          if [[ -n "$CHANGE_ID" && ! "$CHANGE_ID" =~ ^[a-z0-9][a-z0-9-]{1,48}$ ]]; then
            echo "::error::change_id takes 2 to 49 lowercase letters, digits and hyphens, and starts with a letter or digit."
            exit 1
          fi

      - name: Compute matrix
        id: set
        env:
          SELECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.sdk || 'all' }}
          VAR_OVERRIDES: ${{ vars.SDK_REPO_OVERRIDES || '{}' }}
        run: |
          OVERRIDES="$VAR_OVERRIDES"
          if [[ -f factory/sdks.yaml ]]; then
            REGISTRY=$(yq -o=json -I=0 '.sdks | map_values(.repo)' factory/sdks.yaml)
            OVERRIDES=$(jq -cn --argjson a "$REGISTRY" --argjson b "$VAR_OVERRIDES" '$a + $b')
          fi
          ALL='[
            {"language":"js","repo":"js-sdk","make_target":"test-client-js"},
            {"language":"go","repo":"go-sdk","make_target":"test-client-go"},
            {"language":"dotnet","repo":"dotnet-sdk","make_target":"test-client-dotnet","openapi_generator_tag":"v7.11.0"},
            {"language":"python","repo":"python-sdk","make_target":"test-client-python"},
            {"language":"java","repo":"java-sdk","make_target":"test-client-java"}
          ]'
          ALL=$(jq -c --argjson o "$OVERRIDES" '[ .[] | .repo = ($o[.language] // .repo) ]' <<<"$ALL")

          if [[ "$SELECTED" == "all" ]]; then
            MATRIX=$(jq -c . <<<"$ALL")
          else
            MATRIX=$(jq -c --arg l "$SELECTED" '[ .[] | select(.language == $l) ]' <<<"$ALL")
          fi

          echo "Selected: $SELECTED"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # Runs the generator and the SDK's tests, which may come from an unmerged
  # branch, so it holds no token or secret. See the publish job.
  sync:
    name: sync ${{ matrix.language }}
    needs: prepare
    runs-on: ubuntu-latest
    env:
      GENERATOR_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.generator_repo || '' }}
      GENERATOR_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.generator_ref || '' }}
      DELTA: ${{ github.event_name == 'workflow_dispatch' && inputs.change_id != '' && (inputs.openapi_ref != '' || inputs.generator_repo != '' || inputs.generator_ref != '') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout sdk-generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: ${{ env.GENERATOR_REPO || github.repository }}
          ref: ${{ env.GENERATOR_REF || (env.GENERATOR_REPO == '' && github.sha || '') }}
          persist-credentials: false

      # No token needed to clone (public repos).
      - name: Checkout SDK repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          path: clients/fga-${{ matrix.language }}-sdk
          persist-credentials: false

      # The generator may come from another repository, so the delta script
      # comes from this one.
      - name: Checkout factory tools
        if: env.DELTA == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .factory-tools
          sparse-checkout: factory/scripts/delta_sync.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Specify python version
        if: matrix.language == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      # No dependency cache. The factory verify job runs SDK pull request code
      # in the same cache scope, so a restored cache could change what this
      # job generates and the publish job pushes.
      - name: Set up JDK
        if: matrix.language == 'java'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 11
          distribution: "temurin"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # If this fails, the job stops here and no PR is created or updated.
      - name: Regenerate and test SDK
        run: |
          if [[ "$DELTA" == "true" ]]; then
            # A generator change is measured against the generator before it:
            # the parent of a commit on main, or where a branch left main.
            if [[ -n "$GENERATOR_REPO$GENERATOR_REF" ]]; then
              if git merge-base --is-ancestor HEAD origin/main; then
                BASE=$(git rev-parse HEAD^)
              else
                BASE=$(git merge-base HEAD origin/main)
              fi
              echo "Generator before the change: $BASE"
              git worktree add -q --detach "$RUNNER_TEMP/generator-base" "$BASE"
              export BASE_GENERATOR_DIR="$RUNNER_TEMP/generator-base"
            fi
            NEW_OPENAPI_REF="$OPENAPI_REF" .factory-tools/factory/scripts/delta_sync.sh "$LANGUAGE"
            if [[ "$LANGUAGE" == "js" ]]; then
              # The build installed the generator's dependencies. Test with the SDK's.
              make run-in-docker sdk_language=js "image=node:\$(NODE_DOCKER_TAG)" command="npm ci"
            fi
            make "$MAKE_TARGET" -o "build-client-$LANGUAGE"
            exit 0
          fi

          # OPEN_API_REF is only overridden when an explicit ref is provided,
          # otherwise the generator's pinned default (in the Makefile) is used.
          if [[ -n "$OPENAPI_REF" ]]; then
            echo "Generating against OpenFGA API ref: $OPENAPI_REF"
            make ${{ matrix.make_target }} OPEN_API_REF="$OPENAPI_REF"
          else
            make ${{ matrix.make_target }}
          fi
        env:
          OPENAPI_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.openapi_ref || '' }}
          OPENAPI_GENERATOR_CLI_DOCKER_TAG: ${{ matrix.openapi_generator_tag || 'v6.4.0' }}
          LANGUAGE: ${{ matrix.language }}
          MAKE_TARGET: ${{ matrix.make_target }}
      - name: Check for SDK changes
        id: diff
        working-directory: clients/fga-${{ matrix.language }}-sdk
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "CLEAN: no changes found"
            echo "dirty=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "DIRTY: changes found"
          git status
          git --no-pager diff
          echo "dirty=true" >> "$GITHUB_OUTPUT"

      # The publish job reads only these files, and only as data.
      - name: Save the change
        if: always()
        env:
          DIRTY: ${{ steps.diff.outputs.dirty }}
          SDK_DIR: clients/fga-${{ matrix.language }}-sdk
        run: |
          OUT="$RUNNER_TEMP/factory-sync"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          echo failed > "$OUT/status"
          if [[ "$DIRTY" == "true" ]]; then
            git -C "$SDK_DIR" add -A
            git -C "$SDK_DIR" diff --cached --binary > "$OUT/changes.patch"
            git -C "$SDK_DIR" rev-parse HEAD > "$OUT/base"
            echo dirty > "$OUT/status"
          elif [[ "$DIRTY" == "false" ]]; then
            echo clean > "$OUT/status"
          fi

      # Uploaded on every attempt, so a re-run never publishes an older change.
      - name: Upload the change
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-sync-${{ matrix.language }}
          path: ${{ runner.temp }}/factory-sync/
          overwrite: true
          retention-days: 1

      - name: Summary
        if: always()
        run: |
          if [[ "${{ job.status }}" != "success" ]]; then
            echo "### \`${{ matrix.repo }}\`: sync failed, see job logs" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.diff.outputs.dirty }}" == "true" ]]; then
            echo "### \`${{ matrix.repo }}\`: drift detected, the publish job opens or updates the sync PR" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### \`${{ matrix.repo }}\`: in sync, nothing to do" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Pushes each SDK's change and opens its PR. The sync job ran generator and
  # SDK code, so this job runs none of it: it checks the saved patch, then
  # applies it to the index and commits. Only this job holds tokens.
  publish:
    name: publish ${{ matrix.language }}
    needs: [prepare, sync]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      HAS_APP: ${{ secrets.RELEASER_APP_CLIENT_ID != '' }}
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      SDK_REPO: ${{ github.repository_owner }}/${{ matrix.repo }}
      CHANGE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.change_id || '' }}
      GENERATOR_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.generator_repo || '' }}
      GENERATOR_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.generator_ref || '' }}
      PORT_AFTER: ${{ github.event_name == 'workflow_dispatch' && inputs.change_id != '' && inputs.port_after }}
      TRACKING_ISSUE: ${{ github.event_name == 'workflow_dispatch' && inputs.tracking_issue || '' }}
      MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.model || '' }}
      DELTA: ${{ github.event_name == 'workflow_dispatch' && inputs.change_id != '' && (inputs.openapi_ref != '' || inputs.generator_repo != '' || inputs.generator_ref != '') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Download the change
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-sync-${{ matrix.language }}
          path: ${{ runner.temp }}/factory-sync

      - name: Read the sync result
        id: result
        run: |
          STATUS=$(cat "$RUNNER_TEMP/factory-sync/status" 2>/dev/null || true)
          case "$STATUS" in
            clean|dirty|failed) ;;
            *) STATUS=missing ;;
          esac
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Sync result: $STATUS"
          if [[ "$STATUS" == "missing" ]]; then
            echo "::error::No sync result for this SDK. Re-run the failed jobs."
            exit 1
          fi

      - name: Checkout SDK repo
        if: steps.result.outputs.status == 'dirty'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          path: clients/fga-${{ matrix.language }}-sdk
          persist-credentials: false

      # Checked before any token exists. The change must start from a commit
      # on the SDK's main and leave its workflows and actions as main has them,
      # so a pushed branch cannot run new workflow code with the fork's secrets.
      - name: Apply the change
        if: steps.result.outputs.status == 'dirty'
        id: apply
        working-directory: clients/fga-${{ matrix.language }}-sdk
        run: |
          DIR="$RUNNER_TEMP/factory-sync"
          BASE=$(head -n 1 "$DIR/base")
          if [[ ! "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The saved base is not a commit sha."
            exit 1
          fi
          MAIN=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$BASE" "$MAIN"; then
            echo "::error::The saved base is not on the SDK's main branch."
            exit 1
          fi
          git checkout -q --detach "$BASE"
          git apply --cached --binary "$DIR/changes.patch"
          if ! git diff --cached --quiet "$MAIN" -- .github/workflows .github/actions; then
            git --no-pager diff --cached --stat "$MAIN" -- .github/workflows .github/actions
            echo "::error::The change edits .github/workflows or .github/actions, so it is not pushed."
            exit 1
          fi
          if git diff --cached --quiet HEAD; then
            echo "::error::The saved change is empty."
            exit 1
          fi
          git --no-pager diff --cached --stat HEAD

      - name: Generate token
        if: steps.apply.outcome == 'success' && env.HAS_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}

      # Runs from main use the canonical sync branch and a regular PR.
      # Runs dispatched from other branches (WIP previews) get their own
      # branch and a draft PR so they never clobber the main sync PR.
      - name: Resolve sync branch
        if: steps.apply.outcome == 'success'
        id: branch
        run: |
          if [[ -n "$CHANGE_ID" ]]; then
            echo "name=sync/factory-${CHANGE_ID}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "name=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            REF_SLUG=$(echo "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9\n' '-')
            echo "name=${SYNC_BRANCH}-${REF_SLUG}" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG key
        if: steps.apply.outcome == 'success' && env.HAS_GPG == 'true'
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          workdir: clients/fga-${{ matrix.language }}-sdk

      - name: Commit and push sync branch
        if: steps.apply.outcome == 'success'
        id: push
        working-directory: clients/fga-${{ matrix.language }}-sdk
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || secrets.FACTORY_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          GPG_EMAIL: ${{ steps.import-gpg.outputs.email }}
        run: |
          if [[ -z "$PUSH_TOKEN" ]]; then
            echo "::error::No push token. Set the RELEASER_APP_* secrets or FACTORY_TOKEN."
            exit 1
          fi
          if [[ -n "$GPG_EMAIL" ]]; then
            git config user.name openfga-releaser-bot
            git config user.email "$GPG_EMAIL"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

          TRAILERS=()
          if [[ -n "$CHANGE_ID" ]]; then
            TRAILERS=(-m "SDK-Factory-Change: ${CHANGE_ID}")
          fi

          git -c core.hooksPath=/dev/null commit -q -m "$PR_TITLE" \
            -m "Generated from ${{ github.repository }}@${{ github.sha }}" \
            "${TRAILERS[@]}"

          # A retry that generates the same files leaves the branch alone.
          if git fetch -q origin "refs/heads/${BRANCH}" 2>/dev/null \
            && [[ "$(git rev-parse 'FETCH_HEAD^{tree}')" == "$(git rev-parse 'HEAD^{tree}')" ]]; then
            echo "The sync branch already holds this change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push --force \
            "https://x-access-token:${PUSH_TOKEN}@github.com/${SDK_REPO}.git" \
            "HEAD:refs/heads/${BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.apply.outcome == 'success'
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.FACTORY_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          DRAFT: ${{ steps.branch.outputs.draft }}
          CHANGED: ${{ steps.push.outputs.changed }}
          OPENAPI_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.openapi_ref || '' }}
        run: |
          INTRO="This PR syncs the SDK with the latest generator templates and configuration."
          if [[ "$DELTA" == "true" ]]; then
            INTRO="This PR applies one API or generator change to the SDK. It only updates the lines that change touches, so release versions and hand edits on main stay as they are."
          fi
          BODY="$INTRO

          Generated by [\`${{ github.repository }}@${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) via [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."

          if [[ -n "$OPENAPI_REF" ]]; then
            BODY="$BODY

          Generated against OpenFGA API ref [\`${OPENAPI_REF}\`](${{ github.server_url }}/openfga/api/tree/${OPENAPI_REF})."
          fi

          if [[ -n "$GENERATOR_REF" || -n "$GENERATOR_REPO" ]]; then
            BODY="$BODY

          Generator source: \`${GENERATOR_REPO:-${{ github.repository }}}\` at \`${GENERATOR_REF:-${{ github.ref_name }}}\`."
          fi

          if [[ -n "$CHANGE_ID" ]]; then
            BODY="$BODY

          > [!NOTE]
          > SDK factory preview for change \`${CHANGE_ID}\`. A maintainer reviews it before it leaves draft."
            if [[ "$TRACKING_ISSUE" =~ ^[0-9]+$ ]]; then
              BODY="$BODY

          Tracking: ${{ github.repository }}#${TRACKING_ISSUE}"
            fi
            BODY="$BODY

          SDK-Factory-Change: ${CHANGE_ID}"
          elif [[ "$DRAFT" == "true" ]]; then
            BODY="$BODY

          > [!WARNING]
          > Preview from generator branch \`${{ github.ref_name }}\`, not main."
          fi

          EXISTING_PR=$(gh pr list \
            --repo "$SDK_REPO" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || true)

          if [[ -n "$EXISTING_PR" && "$EXISTING_PR" != "null" ]]; then
            PR_NUMBER="$EXISTING_PR"
            if [[ "$CHANGED" == "false" ]]; then
              echo "Sync PR #$EXISTING_PR already has this change"
            else
              echo "Updating existing sync PR #$EXISTING_PR"
              gh pr edit "$EXISTING_PR" \
                --repo "$SDK_REPO" \
                --title "$PR_TITLE" \
                --body "$BODY"

              gh pr comment "$EXISTING_PR" \
                --repo "$SDK_REPO" \
                --body "Updated with the latest regenerated output from [\`${{ github.repository }}@${GITHUB_SHA:0:7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) ([workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})). Please re-review."
            fi
          else
            DRAFT_FLAG=()
            if [[ "$DRAFT" == "true" ]]; then
              DRAFT_FLAG=(--draft)
            fi
            PR_URL=$(gh pr create \
              --repo "$SDK_REPO" \
              --head "$BRANCH" \
              --base main \
              --title "$PR_TITLE" \
              --body "$BODY" \
              "${DRAFT_FLAG[@]}")
            PR_NUMBER="${PR_URL##*/}"
            echo "Created sync PR #$PR_NUMBER"
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          # Best-effort labeling, don't fail the sync over it
          gh label create "$PR_LABEL" \
            --repo "$SDK_REPO" \
            --color "0E8A16" \
            --description "Automated sync from openfga/sdk-generator" \
            --force 2>/dev/null || true
          gh pr edit "$PR_NUMBER" \
            --repo "$SDK_REPO" \
            --add-label "$PR_LABEL" 2>/dev/null || true
          if [[ -n "$CHANGE_ID" ]]; then
            gh pr edit "$PR_NUMBER" \
              --repo "$SDK_REPO" \
              --add-label factory 2>/dev/null || true
          fi

      # Skipped while the fork has an open port PR for this change, so a retry
      # or an updated sync PR never opens a second one. Close a stale port PR
      # to port again.
      - name: Start the port worker
        if: steps.pr.outputs.number != '' && env.PORT_AFTER == 'true' && vars.FACTORY_PAUSED != 'true'
        id: port
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_TOKEN: ${{ steps.app-token.outputs.token || secrets.FACTORY_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.branch.outputs.name }}
          SDK: ${{ matrix.language }}
        run: |
          if ! PRS=$(GH_TOKEN="$FORK_TOKEN" gh pr list --repo "$SDK_REPO" --state open --limit 200 --json headRefName,isCrossRepository,url); then
            echo "::error::Could not list the open PRs in ${SDK_REPO}, so the port worker was not started."
            exit 1
          fi
          OPEN=$(jq -r --arg id "$CHANGE_ID" \
            '[.[] | select((.isCrossRepository | not) and (.headRefName | test("^sdk-factory/" + $id + "(-[0-9a-f]{16})?$")))][0].url // empty' <<<"$PRS")
          if [[ -n "$OPEN" ]]; then
            echo "note=Port worker not started: ${OPEN} is already open." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          extra=()
          if [[ -n "$MODEL" ]]; then
            extra=(-f model="$MODEL")
          fi
          gh workflow run factory-port.lock.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f sdk="$SDK" \
            -f target_repo="$SDK_REPO" \
            -f source="${SDK_REPO}/pull/${PR_NUMBER}" \
            -f change_id="$CHANGE_ID" \
            -f base_branch="$BRANCH" \
            -f tracking_issue="$TRACKING_ISSUE" \
            "${extra[@]}"
          echo "note=Port worker started for \`${SDK_REPO}/pull/${PR_NUMBER}\` on \`${BRANCH}\`." >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          STATUS: ${{ steps.result.outputs.status }}
          CHANGED: ${{ steps.push.outputs.changed }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          NOTE: ${{ steps.port.outputs.note }}
        run: |
          REPO="\`${{ matrix.repo }}\`"
          if [[ "${{ job.status }}" != "success" ]]; then
            LINE="${REPO}: publish failed, see job logs"
          elif [[ "$STATUS" == "clean" ]]; then
            LINE="${REPO}: in sync, nothing to publish"
          elif [[ "$STATUS" == "failed" ]]; then
            LINE="${REPO}: sync failed, nothing published"
          elif [[ "$CHANGED" == "false" ]]; then
            LINE="${REPO}: PR #${PR_NUMBER} already has this change"
          else
            LINE="${REPO}: sync PR #${PR_NUMBER} created or updated"
          fi
          echo "### ${LINE}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$NOTE" ]]; then
            echo "$NOTE" >> "$GITHUB_STEP_SUMMARY"
          fi

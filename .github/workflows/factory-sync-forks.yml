name: SDK factory fork sync

# Brings the hub, the API fork and every SDK fork up to upstream main. Without
# the FACTORY_TOKEN secret it only reports how far behind each fork is.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: factory-sync-forks
  cancel-in-progress: false

jobs:
  sync:
    if: vars.FACTORY_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync the forks
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: python3 factory/scripts/factory_scan.py sync
